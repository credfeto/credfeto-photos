---  # Refresh the photos host's published egress ranges (GitHub, Cloudflare) and commit them to main when they change
name: "Repo: Update egress ranges"
on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/update-egress-ranges.yml"
      - "firewall/update-github-egress-ranges"
      - "firewall/update-cloudflare-egress-ranges"
  schedule:
    - cron: "22 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: false

jobs:
  update-egress-ranges:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: "Check Required Secrets"
        shell: bash
        run: |
          if [ -z "${SOURCE_PUSH_TOKEN}" ]; then
            echo "::error::SOURCE_PUSH_TOKEN is required but not set"
            exit 1
          fi
        env:
          SOURCE_PUSH_TOKEN: "${{secrets.SOURCE_PUSH_TOKEN}}"

      - name: "Initialise Workspace"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: sudo chown -R "$USER:$USER" "$GITHUB_WORKSPACE"

      - name: "Checkout Source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          token: "${{secrets.SOURCE_PUSH_TOKEN}}"
          persist-credentials: true

      - name: "Regenerate egress ranges"
        shell: bash
        run: |
          DIR=firewall
          # The photos host applies these files as egress allow-lists, so a
          # short or failed download must never replace a good list.
          check() {
            FILE="$1"; MIN="$2"; OLD="$3"
            NEW=$(grep -vc '^#' "${FILE}" || true)
            echo "${FILE}: ${OLD} -> ${NEW} ranges"
            if [ "${NEW}" -lt "${MIN}" ] || [ "${NEW}" -lt $((OLD * 8 / 10)) ]; then
              echo "::error::Only ${NEW} ranges in ${FILE} (was ${OLD}); refusing to shrink the allow-list"
              git checkout -- "${FILE}"
              exit 1
            fi
          }
          OLD_GH=$(grep -vc '^#' "${DIR}/github-egress-ranges" || true)
          OLD_CF=$(grep -vc '^#' "${DIR}/cloudflare-egress-ranges" || true)
          "${DIR}/update-github-egress-ranges"
          check "${DIR}/github-egress-ranges" 50 "${OLD_GH}"
          "${DIR}/update-cloudflare-egress-ranges"
          check "${DIR}/cloudflare-egress-ranges" 10 "${OLD_CF}"
          git diff --stat -- "${DIR}"

      - name: "Commit changes to main"
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "[Actions] Updated the photos host egress ranges (GitHub, Cloudflare)"
          branch: "main"
          file_pattern: "firewall/github-egress-ranges firewall/cloudflare-egress-ranges"
          commit_user_name: "fun-version[bot]"
          commit_user_email: "credfeto@users.noreply.github.com"
          commit_author: "fun-version[bot] <credfeto@users.noreply.github.com>"
          skip_dirty_check: false
